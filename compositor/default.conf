# XlinOS settings (xlin.conf). Test copy; the real one is profile/airootfs/usr/share/xlinos/xlin.conf
set bg_color #03081c
set workspaces 4
set gap 8
set snap_edge 24
set animations 1
set natural_scroll 1
set tap_to_click 1

bind SUPER+Return exec foot
bind SUPER+Q close
bind SUPER+Tab next
bind SUPER+Left snap left
bind SUPER+Right snap right
bind SUPER+Up snap up
bind SUPER+Down snap down
bind SUPER+F fullscreen
bind SUPER+H unhide
bind SUPER+SHIFT+D showdesktop
bind SUPER+2 workspace 2
bind SUPER+1 workspace 1
