# XlinOS live installer session: full-screen installer only, no desktop shell or shortcuts.
set bg_color #030a22
set gap 0
set snap_edge 0
set workspaces 1
set animations 0
set natural_scroll 0
set tap_to_click 1

rule os.xlin.installer fullscreen

exec-once dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE
exec-once /usr/local/lib/xlinos/xlinos-installer
