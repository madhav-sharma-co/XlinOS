# XlinOS single configuration (xlin.conf)
# macOS-inspired look, shortcuts, gestures & hot corners + KDE Plasma window management & rules.
# User overrides go in ~/.config/xlin/xlin.conf (reload anytime with: xlinctl reload).

# ---- Look & feel (macOS-like spatial spacing and ergonomics) ----
set bg_color #03081c
set gap 8
set snap_edge 24
set workspaces 4
set cursor_size 24
set animations 1

# ---- Input & trackpad (natural scrolling + tap-to-click) ----
set repeat_rate 25
set repeat_delay 600
set natural_scroll 1
set tap_to_click 1
set pointer_speed 0.0

# ---- Built-in idle lock & sleep (minutes, 0 = off) ----
set idle_lock_minutes 5
set idle_sleep_minutes 15
set idle_lock_cmd xlinos-lock
set idle_sleep_cmd systemctl suspend

# ---- macOS-style Hot Corners ----
# Top-Left: Window Overview (Mission Control)   Top-Right: Control Panel   Bottom-Left: Show Desktop
set hotcorner_tl /usr/local/lib/xlinos/xlinos-overview
set hotcorner_tr /usr/local/lib/xlinos/xlinos-quick
set hotcorner_bl xlinos showdesktop

# ---- macOS-style 3-finger Trackpad Gestures ----
gesture 3 left @ws
gesture 3 right @ws
gesture 3 up /usr/local/lib/xlinos/xlinos-overview
gesture 3 down xlinos showdesktop

# ---- Apps & Spotlight-style Launcher ----
bind SUPER+space exec xlinos-launcher
bind SUPER+Return exec xlinos-terminal
bind SUPER+e exec xlinos-files
bind SUPER+s exec xlinos-settings
bind SUPER+a exec xlinos-quick
bind SUPER+c exec xlinos-quick
bind SUPER+p exec xlinos-quick
bind SUPER+b exec xlinos-quick
bind SUPER+t exec xlinos-clock
bind SUPER+m exec xlinos-monitor
bind SUPER+n exec xlinos-notes
bind SUPER+v exec xlinos-clipboard
bind SUPER+l exec xlinos-lock
bind SUPER+slash exec xlinos-keys
bind SUPER+F1 exec xlinos-help
bind CTRL+SHIFT+Escape exec xlinos-monitor

# ---- System & Theme ----
bind SUPER+d exec xlinos theme toggle
bind SUPER+w exec xlinos wallpaper next
bind SUPER+SHIFT+q exec xlinos-logout

# ---- Screenshots ----
bind Print exec xlinos-screenshot area
bind SUPER+SHIFT+s exec xlinos-screenshot area
bind SUPER+Print exec xlinos-screenshot full
bind SHIFT+Print exec xlinos-screenshot full
bind ALT+Print exec xlinos-screenshot window

# ---- Brightness & Volume (also work while locked) ----
bind SUPER+CTRL+Up exec brightnessctl set 8%+
bind SUPER+CTRL+Down exec brightnessctl set 8%-
bind SUPER+CTRL+Right exec wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind SUPER+CTRL+Left exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind XF86AudioRaiseVolume exec wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind XF86MonBrightnessUp exec brightnessctl set 8%+
bind XF86MonBrightnessDown exec brightnessctl set 8%-

# ---- Window Management (macOS Cmd+Q / Overview + KDE Quick Tiling & Resize) ----
bind SUPER+q close
bind SUPER+f fullscreen
bind SUPER+CTRL+m minimize
bind ALT+Tab next
bind SUPER+Tab exec /usr/local/lib/xlinos/xlinos-overview
bind SUPER+h unhide
bind SUPER+SHIFT+d showdesktop

bind SUPER+Left snap left
bind SUPER+Right snap right
bind SUPER+Up snap up
bind SUPER+Down snap down
bind SUPER+SHIFT+c snap center

bind SUPER+SHIFT+Left focus left
bind SUPER+SHIFT+Right focus right
bind SUPER+SHIFT+Up focus up
bind SUPER+SHIFT+Down focus down

bind SUPER+CTRL+SHIFT+Left resize -40 0
bind SUPER+CTRL+SHIFT+Right resize 40 0
bind SUPER+CTRL+SHIFT+Up resize 0 -40
bind SUPER+CTRL+SHIFT+Down resize 0 40

# ---- Virtual Desktops (KDE Workspaces / macOS Spaces) ----
bind SUPER+1 workspace 1
bind SUPER+2 workspace 2
bind SUPER+3 workspace 3
bind SUPER+4 workspace 4
bind SUPER+SHIFT+1 movetoworkspace 1
bind SUPER+SHIFT+2 movetoworkspace 2
bind SUPER+SHIFT+3 movetoworkspace 3
bind SUPER+SHIFT+4 movetoworkspace 4
bind SUPER+ALT+Right workspace-next
bind SUPER+ALT+Left workspace-prev

# ---- KDE Plasma-style Window Rules ----
rule os.xlin.* center
rule os.xlin.calculator size=360x520 center
rule os.xlin.clock size=480x420 center
rule os.xlin.screenshot size=440x320 center
rule os.xlin.clipboard size=520x460 center

# ---- Session Autostart ----
exec-once dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE
exec-once /usr/local/lib/xlinos/xlinos-shell
exec-once /usr/local/lib/xlinos/xlinos-notify
exec-once /usr/local/lib/xlinos/xlinos-apply
exec-once sh -c 'command -v cliphist >/dev/null && exec wl-paste --watch cliphist store'
exec-once sh -c 'command -v /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 >/dev/null && exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1'
