general {
    hide_cursor = true
    ignore_empty_input = true
}
background {
    monitor =
    path = /usr/share/xlinos/wallpapers/xlin-dark.jpg
    blur_passes = 2
    blur_size = 6
}
label {
    monitor =
    text = $TIME
    color = rgba(255,255,255,1.0)
    font_size = 110
    font_family = Inter Thin
    position = 0, 190
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = rgba(157,180,230,1.0)
    font_size = 22
    position = 0, 90
    halign = center
    valign = center
}
label {
    monitor =
    text = $USER
    color = rgba(255,255,255,1.0)
    font_size = 18
    position = 0, -30
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    outer_color = rgba(30,107,255,0.8)
    inner_color = rgba(12,20,56,0.8)
    font_color = rgba(255,255,255,1.0)
    fade_on_empty = false
    rounding = 25
    placeholder_text = Enter password
    fail_text = Wrong password
    position = 0, -90
    halign = center
    valign = center
}
