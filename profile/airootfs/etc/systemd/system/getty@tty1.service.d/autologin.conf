[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -f -- \\u' --noclear --noissue --nohostname --autologin xlin %I $TERM
# paint the console black before agetty prints its automatic-login line, so no text shows between the boot logo and the installer
ExecStartPre=-/usr/bin/sh -c 'printf "\\033[30;40m\\033[8m\\033[H\\033[2J" >/dev/tty1'
