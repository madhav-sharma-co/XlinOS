name: Compositor test
on:
  workflow_dispatch:
  push:
    paths: ["compositor/**", ".github/workflows/compositor-test.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: |
          pacman -Sy --noconfirm
          W=$(pacman -Ssq '^wlroots' | sort -V | tail -1); echo "using $W"
          pacman -Su --noconfirm base-devel git $W wayland wayland-protocols wlr-protocols libxkbcommon pkgconf foot gdb grim swaylock python imagemagick xorg-xwayland ttf-dejavu
      - uses: actions/checkout@v4
      - name: Build
        run: |
          pkg-config --list-all | grep -i wlroots
          make -C compositor
      - name: Run headless and test
        run: |
          mkdir -p /tmp/rt out && chmod 700 /tmp/rt
          export XDG_RUNTIME_DIR=/tmp/rt WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_HEADLESS_OUTPUTS=1 WLR_LIBINPUT_NO_DEVICES=1 HOME=/tmp/home OUT=$PWD/out
          mkdir -p $HOME
          cd compositor
          timeout 150 ./xlin-comp -c default.conf -s "$PWD/../scripts/ci/comp-test.sh" > ../out/comp.log 2>&1 || true
          cat ../out/comp.log | tail -30; cat ../out/result.txt
          ! grep -q FAIL ../out/result.txt && grep -q '^done' ../out/result.txt
      - name: Publish the screenshot
        if: always()
        run: |
          cd out && git init -q && git config user.email ci@xlinos && git config user.name ci
          git add -A && git commit -qm "compositor test" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-shots-comp
