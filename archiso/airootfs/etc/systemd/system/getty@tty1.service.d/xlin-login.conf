# tty1 runs the XlinOS login wrapper: on first boot it creates the first user, then shows the login prompt.
# Running it inside the getty (not as a separate boot service) keeps multi-user.target from waiting for input.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --noreset --noclear --skip-login --login-program /usr/local/bin/xlin-login %I $TERM
