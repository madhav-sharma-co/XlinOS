# pacman configuration used by mkarchiso to build XlinOS. Not installed into the ISO.
[options]
HoldPkg     = pacman glibc
Architecture = x86_64
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Mirrors come from the build host's /etc/pacman.d/mirrorlist.
# For reproducible builds point that mirrorlist at an Arch Linux Archive date
# (see docs/BUILD.md).
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
